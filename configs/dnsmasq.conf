# RHCSA Lab DNS Configuration
# Provides name resolution for lab.example.com domain

# Don't read /etc/resolv.conf - use upstream DNS
no-resolv

# Upstream DNS servers (use Docker's built-in DNS + Google)
server=127.0.0.11
server=8.8.8.8
server=8.8.4.4

# Listen on all interfaces
listen-address=0.0.0.0
bind-interfaces

# Domain for local resolution
domain=lab.example.com
local=/lab.example.com/
local=/example.com/

# Expand simple hostnames to FQDN
expand-hosts

# Static host entries for the lab
address=/bastion.lab.example.com/172.25.250.254
address=/classroom.example.com/172.25.250.254
address=/content.example.com/172.25.250.254
address=/materials.example.com/172.25.250.254
address=/workstation.lab.example.com/172.25.250.9
address=/servera.lab.example.com/172.25.250.10
address=/serverb.lab.example.com/172.25.250.11

# PTR records for reverse DNS
ptr-record=254.250.25.172.in-addr.arpa,bastion.lab.example.com
ptr-record=9.250.25.172.in-addr.arpa,workstation.lab.example.com
ptr-record=10.250.25.172.in-addr.arpa,servera.lab.example.com
ptr-record=11.250.25.172.in-addr.arpa,serverb.lab.example.com

# Don't forward short names upstream
domain-needed
bogus-priv

# Cache size
cache-size=1000

# Log queries for debugging (comment out in production)
# log-queries
